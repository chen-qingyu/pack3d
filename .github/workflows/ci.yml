name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - name: Configure
        run: xmake f -m release -y
      - name: Build
        run: xmake build
      - name: Run tests
        run: xmake run test
      - name: CLI smoke
        run: xmake run cli data/demo.json -a gep

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: xmake-io/github-action-setup-xmake@v1
      - name: Configure
        run: xmake f -m release -y
      - name: Build Python wheel
        run: |
          python -m pip install build
          python -m build python
      - name: Check Python interfaces
        run: |
          python -m pip install --force-reinstall python/dist/*.whl
          python -c "import pack3d; assert callable(pack3d.run)"
